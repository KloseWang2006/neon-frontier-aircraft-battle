<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>霓虹防线 · 飞机大战</title>
  <style>
    :root {
      color-scheme: dark;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: radial-gradient(circle at 20% 0, #292568, transparent 34%), #05061a;
      color: #eef;
      font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }
    .page {
      width: min(850px, calc(100% - 28px));
      margin: auto;
      padding: 22px;
    }
    .layout {
      display: grid;
      grid-template-columns: 420px 267px;
      gap: 18px;
    }
    .card {
      background: #10133ddd;
      border: 1px solid #7189df55;
      border-radius: 18px;
      padding: 14px;
    }
    .arena {
      position: relative;
      aspect-ratio: 2/3;
      border: 1px solid #58e7ff;
      border-radius: 12px;
      overflow: hidden;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .side {
      display: grid;
      gap: 13px;
    }
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .stat,
    .buff {
      padding: 10px;
      border: 1px solid #7189df55;
      border-radius: 9px;
    }
    .stat strong {
      display: block;
      font:
        800 22px Menlo,
        monospace;
    }
    .best {
      color: #ffc75a;
    }
    .lives {
      color: #ff71b5;
      text-shadow: 0 0 10px #ff54ae;
    }
    .state-ready {
      color: #aeb9ff;
    }
    .state-running {
      color: #5ef3ff;
      text-shadow: 0 0 10px #58e7ff;
    }
    .state-paused {
      color: #ffc75a;
      text-shadow: 0 0 10px #ffc75a;
    }
    .buff-shield b {
      color: #5ef3ff;
    }
    .buff-spread b {
      color: #c9a9ff;
    }
    .buff-double b {
      color: #ffcf62;
    }
    .row,
    .buff {
      display: flex;
      justify-content: space-between;
      margin-top: 9px;
    }
    .skill-card {
      margin-top: 12px;
      padding: 10px;
      border: 1px solid #3f9dce;
      border-radius: 10px;
      background: #0b284244;
    }
    .skill-meter {
      height: 8px;
      margin: 8px 0;
      border-radius: 99px;
      overflow: hidden;
      background: #051429;
      border: 1px solid #3381ae;
    }
    .skill-meter-fill {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, #2ad5ff, #9e7cff);
      box-shadow: 0 0 12px #58e7ff;
      transition: width 0.15s;
    }
    .shockwave-ready {
      color: #72f1ff;
      text-shadow: 0 0 10px #58e7ff;
    }
    .skill-btn {
      width: 100%;
      margin-top: 8px;
    }
    .skill-btn:disabled {
      opacity: 0.5;
      filter: saturate(0.45);
      cursor: not-allowed;
    }
    .btns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .btn,
    .pad button {
      border: 1px solid #58e7ff;
      border-radius: 8px;
      background: #193368;
      color: #eef;
      min-height: 42px;
      font:
        700 15px 'PingFang SC',
        'Microsoft YaHei',
        sans-serif;
    }
    .btn.main {
      background: linear-gradient(135deg, #67e8ff, #7788ff);
      color: #071021;
    }
    .pad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .pad button {
      font-size: 22px;
    }
    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: #000a;
    }
    .overlay[hidden] {
      display: none;
    }
    .modal {
      width: min(320px, 90%);
      padding: 20px;
      border: 1px solid #58e7ff;
      border-radius: 14px;
      background: #101342;
      text-align: center;
    }
    .modal input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      background: #060821;
      border: 1px solid #7989d8;
      color: #fff;
    }
    .register-form {
      display: grid;
      gap: 10px;
      margin: 18px 0 12px;
      text-align: left;
    }
    .register-form label {
      color: #b9c5ed;
      font-size: 13px;
      font-weight: 700;
    }
    .register-form .btn {
      text-align: center;
    }
    .modal-secondary {
      width: 100%;
      margin-top: 4px;
      background: #111d4c;
    }
    .rank {
      padding: 0;
      list-style: none;
      font:
        12px Menlo,
        monospace;
    }
    .rank li {
      display: grid;
      grid-template-columns: 22px 1fr 66px 58px;
      padding: 5px;
      border-top: 1px solid #7892d822;
    }
    .notice {
      position: absolute;
      top: 45%;
      width: 100%;
      text-align: center;
      color: #58e7ff;
      font-weight: 800;
      text-shadow: 0 0 14px #58e7ff;
      pointer-events: none;
    }
    @media (max-width: 780px) {
      .layout {
        grid-template-columns: 1fr;
      }
      .side {
        grid-template-columns: 1fr 1fr;
      }
    }
    @media (max-width: 465px) {
      .side {
        grid-template-columns: 1fr;
      }
    }
  </style>
  <style>
    .fighter-select h3 {
      margin: 0 0 9px;
      font-size: 15px;
    }
    .fighter-select p {
      margin: 3px 0 10px;
      color: #aeb9df;
      font-size: 12px;
    }
    .fighter-options {
      display: grid;
      gap: 8px;
    }
    .fighter-choice {
      display: grid;
      grid-template-columns: 44px 1fr;
      gap: 8px;
      align-items: center;
      width: 100%;
      padding: 7px;
      border: 1px solid #5267a8;
      border-radius: 10px;
      background: #0a1030;
      color: #eaf0ff;
      text-align: left;
      cursor: pointer;
    }
    .fighter-choice img {
      width: 42px;
      height: 38px;
      object-fit: contain;
      image-rendering: auto;
      transform: rotate(var(--fighter-rotation, 0deg));
    }
    .fighter-choice strong {
      display: block;
      font-size: 14px;
    }
    .fighter-choice small {
      display: block;
      margin-top: 2px;
      color: #aeb9df;
      font-size: 11px;
    }
    .fighter-choice.selected {
      border-color: var(--fighter-border, #65e8ff);
      box-shadow: 0 0 12px var(--fighter-glow, #38d8ff55);
      background: var(--fighter-background, #15365b);
    }
    .fighter-choice:disabled {
      cursor: not-allowed;
      opacity: 0.62;
    }
    .stealth-active {
      color: #dcecff;
      text-shadow: 0 0 10px #b7dcff;
    }
    .wingmen-active {
      color: #7dffab;
      text-shadow: 0 0 10px #55ff90;
    }
    .homing-active {
      color: #ffe85b;
      text-shadow: 0 0 10px #ffc75a;
    }
    .blink-card {
      margin-top: 12px;
      padding: 10px;
      border: 1px solid #d8a93f;
      border-radius: 10px;
      background: #2a210b55;
    }
    .blink-card-silver {
      border-color: #b9c8d9;
      background: #20293666;
      box-shadow: 0 0 14px #b9c8d933;
    }
    .blink-card-silver .blink-ready {
      color: #e9f2ff;
      text-shadow: 0 0 10px #c9ddf5;
    }
    .blink-card-silver .blink-locked {
      color: #ffffff;
      text-shadow: 0 0 10px #d9eeff;
    }
    .blink-card-silver .blink-cooldown {
      color: #b8c7d8;
    }
    .blink-ready {
      color: #ffe85b;
      text-shadow: 0 0 10px #ffc75a;
    }
    .blink-locked {
      color: #fff0a0;
      text-shadow: 0 0 10px #ffe85b;
    }
    .blink-cooldown {
      color: #c8b77e;
    }
    .shield-card {
      margin-top: 12px;
      padding: 10px;
      border: 1px solid #3f9dce;
      border-radius: 10px;
      background: #0b284244;
    }
    .shield-skill-ready {
      color: #72f1ff;
      text-shadow: 0 0 10px #58e7ff;
    }
    .shield-skill-active {
      color: #b9fbff;
      text-shadow: 0 0 12px #58e7ff;
    }
    .shield-skill-cooldown {
      color: #9eb6c8;
    }
  </style>
  <style>
    .page {
      width: min(1120px, calc(100% - 28px));
    }
    .layout {
      grid-template-columns: 420px 267px 267px;
    }
    .action-side {
      align-content: start;
    }
    @media (max-width: 1050px) {
      .layout {
        grid-template-columns: 420px 267px;
      }
      .action-side {
        grid-column: 2;
      }
    }
    @media (max-width: 780px) {
      .layout {
        grid-template-columns: 1fr;
      }
      .status-side,
      .action-side {
        grid-column: auto;
        grid-template-columns: 1fr;
      }
    }
  </style>
  <body>
    <main class="page">
      <h1>霓虹防线 · 飞机大战</h1>
      <section class="layout">
        <div class="card">
          <div class="arena">
            <canvas id="game" width="480" height="720"></canvas>
            <div class="notice" id="notice"></div>
            <div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
          </div>
        </div>
        <aside class="side status-side">
          <section class="card">
            <div class="stats">
              <div class="stat">本局得分<strong id="score">000000</strong></div>
              <div class="stat">最高分<strong class="best" id="best">000000</strong></div>
            </div>
            <div class="row">
              生命 <b class="lives" id="lives">♥♥♥</b
              ><b class="state-ready" id="state">等待起飞</b>
            </div>
            <div class="row">战斗用时 <b id="timer">00:00.0</b></div>
            <div class="buff buff-shield">护盾 <b id="shield">未激活</b></div>
            <div class="buff buff-spread">散射弹 <b id="spread">未激活</b></div>
            <div class="buff buff-double">双倍火力 <b id="double">未激活</b></div>
            <div class="skill-card">
              <div class="row">
                <span id="skillName">战机技能</span><b id="skillCharge">0 / 100</b>
              </div>
              <div class="skill-meter"><div class="skill-meter-fill" id="skillMeter"></div></div>
              <div class="row"><span>技能状态</span><b id="skillStatus">充能中</b></div>
              <button class="btn skill-btn" id="skillButton" disabled>Q · 充能技 · 技能</button>
            </div>
            <div class="blink-card" id="blinkCard" hidden>
              <div class="row">
                <span id="blinkName">瞬闪突袭</span><b id="blinkStatus">可标记</b>
              </div>
              <button class="btn skill-btn" id="blinkButton">E · 普通技 · 瞬闪突袭</button>
            </div>
            <div class="shield-card" id="shieldCard" hidden>
              <div class="row">
                <span id="shieldSkillName">潮涌屏障</span><b id="shieldSkillStatus">可释放</b>
              </div>
              <button class="btn skill-btn" id="shieldButton">E · 普通技 · 潮涌屏障</button>
            </div>
          </section>
          <section class="card">
            <button class="btn" id="rankBtn">查看排行榜</button>
            <ol class="rank" id="rank"></ol>
          </section>
        </aside>
        <aside class="side action-side">
          <section class="card fighter-select">
            <h3>选择战机</h3>
            <p>仅准备阶段可预选，开局后锁定。</p>
            <div class="fighter-options" id="fighterOptions"></div>
          </section>
          <section class="card">
            <div class="btns">
              <button class="btn main" id="pause">暂停</button
              ><button class="btn" id="restart">重新开始</button>
            </div>
          </section>
          <section class="card">
            移动与射击
            <div class="pad">
              <button data-k="up">↑</button><button data-k="left">←</button
              ><button data-k="down">↓</button><button data-k="right">→</button>
            </div>
          </section>
        </aside>
      </section>
    </main>
    <script src="fighter-catalog.js"></script>
    <script src="game-rules.js"></script>
    <script src="game-storage.js"></script>
    <script src="run-session.js"></script>
    <script src="page-presentation.js"></script>
    <script>
      const canvas = document.querySelector('#game'),
        keys = {},
        storage = GameStorage.adapter(localStorage);
      let session = RunSession.create({ rules: GameRules, storage }),
        last = 0;
      const presentation = PagePresentation.create({
        document,
        canvas,
        catalog: FighterCatalog,
        onIntent: dispatch,
      });
      const snapshot = () => ({
        game: session.game,
        view: session.view,
        best: session.best,
        board: session.board,
      });
      function render() {
        presentation.render(snapshot());
      }
      function dispatch(intent) {
        if (intent.type === 'start') session = RunSession.start(session);
        if (intent.type === 'restart') session = RunSession.restart(session);
        if (intent.type === 'toggle-pause') session = RunSession.togglePause(session);
        if (intent.type === 'select-fighter')
          session = RunSession.selectFighter(session, intent.fighterId);
        if (intent.type === 'skill' && session.game.status === 'running') keys.skill = true;
        if (intent.type === 'blink' && session.game.status === 'running') keys.blink = true;
        if (intent.type === 'direction') keys[intent.direction] = intent.pressed;
        if (intent.type === 'register') session = RunSession.register(session, intent.id);
        render();
      }
      const keyMap = {
        ArrowLeft: 'left',
        a: 'left',
        A: 'left',
        ArrowRight: 'right',
        d: 'right',
        D: 'right',
        ArrowUp: 'up',
        w: 'up',
        W: 'up',
        ArrowDown: 'down',
        s: 'down',
        S: 'down',
      };
      document.addEventListener('keydown', (event) => {
        if (event.key === 'q' || event.key === 'Q') {
          if (!event.repeat) dispatch({ type: 'skill' });
          event.preventDefault();
          return;
        }
        if (event.key === 'e' || event.key === 'E') {
          if (!event.repeat) dispatch({ type: 'blink' });
          event.preventDefault();
          return;
        }
        if (keyMap[event.key]) {
          keys[keyMap[event.key]] = true;
          event.preventDefault();
        }
        if (event.code === 'Space') {
          event.preventDefault();
          dispatch({ type: 'toggle-pause' });
        }
      });
      document.addEventListener('keyup', (event) => {
        if (keyMap[event.key]) keys[keyMap[event.key]] = false;
      });
      function loop(now) {
        requestAnimationFrame(loop);
        const dt = Math.min(34, now - last || 16);
        last = now;
        if (session.game.status === 'running') {
          session = RunSession.advance(session, { dt, input: keys, random: Math.random });
          keys.skill = false;
          keys.blink = false;
        }
        render();
      }
      render();
      requestAnimationFrame(loop);
    </script>
  </body>
</html>
