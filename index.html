<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>霓虹防线 · 飞机大战</title>
  <style>
    :root {
      color-scheme: dark;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: radial-gradient(circle at 20% 0, #292568, transparent 34%), #05061a;
      color: #eef;
      font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }
    .page {
      width: min(850px, calc(100% - 28px));
      margin: auto;
      padding: 22px;
    }
    .layout {
      display: grid;
      grid-template-columns: 420px 267px;
      gap: 18px;
    }
    .card {
      background: #10133ddd;
      border: 1px solid #7189df55;
      border-radius: 18px;
      padding: 14px;
    }
    .arena {
      position: relative;
      aspect-ratio: 2/3;
      border: 1px solid #58e7ff;
      border-radius: 12px;
      overflow: hidden;
    }
    .arena-panel {
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: stretch;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .side {
      display: grid;
      gap: 13px;
    }
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .stat,
    .buff {
      padding: 10px;
      border: 1px solid #7189df55;
      border-radius: 9px;
    }
    .stat strong {
      display: block;
      font:
        800 22px Menlo,
        monospace;
    }
    .best {
      color: #ffc75a;
    }
    .lives {
      color: #ff71b5;
      text-shadow: 0 0 10px #ff54ae;
    }
    .state-ready {
      color: #aeb9ff;
    }
    .state-running {
      color: #5ef3ff;
      text-shadow: 0 0 10px #58e7ff;
    }
    .state-paused {
      color: #ffc75a;
      text-shadow: 0 0 10px #ffc75a;
    }
    .buff-shield b {
      color: #5ef3ff;
    }
    .buff-spread b {
      color: #c9a9ff;
    }
    .buff-double b {
      color: #ffcf62;
    }
    .row,
    .buff {
      display: flex;
      justify-content: space-between;
      margin-top: 9px;
    }
    .skill-card {
      --skill-color: #3f9dce;
      --skill-glow: #58e7ff55;
      margin-top: 12px;
      padding: 10px;
      border: 1px solid var(--skill-color);
      border-radius: 10px;
      background: color-mix(in srgb, var(--skill-color) 10%, #0b102d);
      box-shadow: 0 0 14px var(--skill-glow);
    }
    .skill-meter {
      height: 8px;
      margin: 8px 0;
      border-radius: 99px;
      overflow: hidden;
      background: #051429;
      border: 1px solid #3381ae;
    }
    .skill-meter-fill {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, #2ad5ff, #9e7cff);
      box-shadow: 0 0 12px #58e7ff;
      transition: width 0.15s;
    }
    .skill-card .skill-ready {
      color: var(--skill-color);
      text-shadow: 0 0 10px var(--skill-color);
    }
    .skill-btn {
      width: 100%;
      margin-top: 8px;
    }
    .skill-card .skill-btn {
      border-color: var(--skill-color);
      background: linear-gradient(
        135deg,
        color-mix(in srgb, var(--skill-color) 48%, #102344),
        #172950
      );
      color: color-mix(in srgb, var(--skill-color) 62%, #fff);
      box-shadow: 0 0 12px var(--skill-glow);
    }
    .skill-btn:disabled {
      opacity: 0.5;
      filter: saturate(0.45);
      cursor: not-allowed;
    }
    .btns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .btn,
    .pad button {
      border: 1px solid #58e7ff;
      border-radius: 8px;
      background: #193368;
      color: #eef;
      min-height: 42px;
      font:
        700 15px 'PingFang SC',
        'Microsoft YaHei',
        sans-serif;
    }
    .btn.main {
      background: linear-gradient(135deg, #67e8ff, #7788ff);
      color: #071021;
    }
    .btn.guide-control-locked,
    .btn.main.guide-control-locked {
      background: linear-gradient(135deg, #202b46, #151d34);
      border-color: #566584;
      color: #9aa8c6;
      box-shadow: none;
      cursor: not-allowed;
      filter: grayscale(0.75);
      opacity: 0.68;
      text-shadow: none;
    }
    .pad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .pad button {
      font-size: 22px;
    }
    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: #000a;
    }
    .overlay[hidden] {
      display: none;
    }
    .modal {
      width: min(320px, 90%);
      padding: 20px;
      border: 1px solid #58e7ff;
      border-radius: 14px;
      background: #101342;
      text-align: center;
    }
    .modal input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      background: #060821;
      border: 1px solid #7989d8;
      color: #fff;
    }
    .register-form {
      display: grid;
      gap: 10px;
      margin: 18px 0 12px;
      text-align: left;
    }
    .register-form label {
      color: #b9c5ed;
      font-size: 13px;
      font-weight: 700;
    }
    .register-form .btn {
      text-align: center;
    }
    .modal-secondary {
      width: 100%;
      margin-top: 4px;
      background: #111d4c;
    }
    .rank {
      padding: 0;
      list-style: none;
      font:
        12px Menlo,
        monospace;
    }
    .rank li {
      display: grid;
      grid-template-columns: 22px 1fr 66px 58px;
      padding: 5px;
      border-top: 1px solid #7892d822;
    }
    .notice {
      position: absolute;
      top: 45%;
      width: 100%;
      text-align: center;
      color: #58e7ff;
      font-weight: 800;
      text-shadow: 0 0 14px #58e7ff;
      pointer-events: none;
    }
    @media (max-width: 780px) {
      .layout {
        grid-template-columns: 1fr;
      }
      .side {
        grid-template-columns: 1fr 1fr;
      }
    }
    .mobile-hud,
    .mobile-combat-dock {
      display: none;
    }
    @media (max-width: 780px) and (orientation: portrait) {
      body {
        overscroll-behavior-y: contain;
      }
      .page {
        width: 100%;
        min-height: 100dvh;
        padding: max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right))
          max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
      }
      h1 {
        margin: 0 0 8px;
        font-size: clamp(22px, 7vw, 30px);
      }
      .layout {
        display: block;
      }
      .status-side,
      .action-side {
        display: none;
      }
      .mobile-hud {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 6px 10px;
        align-items: center;
        margin-bottom: 8px;
        padding: 8px 10px;
        border: 1px solid #7189df77;
        border-radius: 12px;
        background: #10133de8;
      }
      .mobile-hud .mobile-stats {
        display: flex;
        gap: 10px;
        align-items: center;
        min-width: 0;
        color: #c7d2f4;
        font-size: 12px;
      }
      .mobile-hud strong {
        color: #fff;
        font:
          800 16px Menlo,
          monospace;
      }
      .mobile-hud .mobile-lives {
        color: #ff71b5;
        font-size: 17px;
        text-shadow: 0 0 8px #ff54ae;
      }
      .mobile-hud .mobile-time {
        color: #b9c5ed;
        font:
          700 12px Menlo,
          monospace;
      }
      .mobile-menu-btn {
        min-height: 44px;
        padding: 0 12px;
        touch-action: manipulation;
      }
      .arena-panel {
        gap: 8px;
        padding: 0;
        border: 0;
        background: transparent;
      }
      .arena {
        width: min(calc(100vw - 24px), 366px);
        margin: 0 auto;
      }
      canvas {
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }
      .arena-skill-progress {
        display: none;
      }
      .mobile-combat-dock {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        width: min(calc(100vw - 24px), 366px);
        margin: 0 auto;
        padding-bottom: max(2px, env(safe-area-inset-bottom));
      }
      .mobile-combat-dock .btn {
        min-height: 52px;
        padding: 7px;
        touch-action: manipulation;
        font-size: 14px;
      }
      .mobile-combat-dock .mobile-utility {
        border-color: var(--mobile-fighter-color, #58e7ff);
        color: color-mix(in srgb, var(--mobile-fighter-color, #58e7ff) 72%, #fff);
      }
      .modal.mobile-menu {
        width: min(340px, 92%);
        max-height: 86%;
        overflow-y: auto;
        text-align: left;
      }
      .mobile-menu-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin: 12px 0;
      }
      .mobile-menu-actions .btn:last-child,
      .mobile-menu-actions .full {
        grid-column: 1 / -1;
      }
      .mobile-menu-fighters {
        display: grid;
        gap: 7px;
        margin: 10px 0;
      }
      .mobile-menu-fighters .fighter-choice {
        min-height: 56px;
      }
    }
    @media (max-width: 780px) and (orientation: portrait) and (max-height: 720px) {
      .arena,
      .mobile-combat-dock {
        width: min(calc(100vw - 24px), 310px);
      }
      .mobile-hud {
        padding-block: 6px;
      }
    }
    @media (max-width: 465px) {
      .side {
        grid-template-columns: 1fr;
      }
    }
  </style>
  <style>
    .fighter-select h3 {
      margin: 0 0 9px;
      font-size: 15px;
    }
    .fighter-select p {
      margin: 3px 0 10px;
      color: #aeb9df;
      font-size: 12px;
    }
    .fighter-options {
      display: grid;
      gap: 8px;
    }
    .fighter-skill-progress {
      --progress-color: #5ef;
      --progress-glow: #38d8ff66;
      display: grid;
      gap: 7px;
      padding: 2px 1px;
    }
    .fighter-progress-row {
      display: grid;
      grid-template-columns: minmax(80px, auto) minmax(58px, 1fr) auto auto;
      gap: 7px;
      align-items: center;
      min-height: 25px;
      white-space: nowrap;
      font-size: 12px;
    }
    .fighter-progress-row b {
      color: var(--progress-color);
      text-shadow: 0 0 10px var(--progress-glow);
    }
    .fighter-progress-meter {
      height: 6px;
      overflow: hidden;
      border: 1px solid color-mix(in srgb, var(--progress-color) 58%, #21325d);
      border-radius: 99px;
      background: #051429;
    }
    .fighter-progress-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(
        90deg,
        color-mix(in srgb, var(--progress-color) 72%, #fff),
        var(--progress-color)
      );
      box-shadow: 0 0 12px var(--progress-glow);
      transition: width 120ms linear;
    }
    .fighter-progress-row small {
      color: #aeb9df;
      font-size: 10px;
      text-align: right;
    }
    .fighter-choice {
      display: grid;
      grid-template-columns: 44px 1fr;
      gap: 8px;
      align-items: center;
      width: 100%;
      padding: 7px;
      border: 1px solid #5267a8;
      border-radius: 10px;
      background: #0a1030;
      color: #eaf0ff;
      text-align: left;
      cursor: pointer;
    }
    .fighter-choice img {
      width: 42px;
      height: 38px;
      object-fit: contain;
      image-rendering: auto;
      transform: rotate(var(--fighter-rotation, 0deg));
    }
    .fighter-choice strong {
      display: block;
      font-size: 14px;
    }
    .fighter-choice small {
      display: block;
      margin-top: 2px;
      color: #aeb9df;
      font-size: 11px;
    }
    .fighter-choice.selected {
      border-color: var(--fighter-border, #65e8ff);
      box-shadow: 0 0 12px var(--fighter-glow, #38d8ff55);
      background: var(--fighter-background, #15365b);
    }
    .fighter-choice:disabled {
      cursor: not-allowed;
      opacity: 0.62;
    }
    .stealth-active {
      color: #dcecff;
      text-shadow: 0 0 10px #b7dcff;
    }
    .wingmen-active {
      color: #7dffab;
      text-shadow: 0 0 10px #55ff90;
    }
    .homing-active {
      color: #ffe85b;
      text-shadow: 0 0 10px #ffc75a;
    }
    .blink-card {
      margin-top: 12px;
      padding: 10px;
      border: 1px solid #d8a93f;
      border-radius: 10px;
      background: #2a210b55;
    }
    .blink-card-silver {
      border-color: #b9c8d9;
      background: #20293666;
      box-shadow: 0 0 14px #b9c8d933;
    }
    .blink-card-silver .blink-ready {
      color: #e9f2ff;
      text-shadow: 0 0 10px #c9ddf5;
    }
    .blink-card-silver .blink-locked {
      color: #ffffff;
      text-shadow: 0 0 10px #d9eeff;
    }
    .blink-card-silver .blink-cooldown {
      color: #b8c7d8;
    }
    .blink-ready {
      color: #ffe85b;
      text-shadow: 0 0 10px #ffc75a;
    }
    .blink-locked {
      color: #fff0a0;
      text-shadow: 0 0 10px #ffe85b;
    }
    .blink-cooldown {
      color: #c8b77e;
    }
    .shield-card {
      margin-top: 12px;
      padding: 10px;
      border: 1px solid #3f9dce;
      border-radius: 10px;
      background: #0b284244;
    }
    .shield-skill-ready {
      color: #72f1ff;
      text-shadow: 0 0 10px #58e7ff;
    }
    .shield-skill-active {
      color: #b9fbff;
      text-shadow: 0 0 12px #58e7ff;
    }
    .shield-skill-cooldown {
      color: #9eb6c8;
    }
    .shadow-strike-card {
      margin-top: 12px;
      padding: 10px;
      border: 1px solid #67e99a;
      border-radius: 10px;
      background: #103b2a77;
      box-shadow: 0 0 14px #56ff9b2b;
    }
    .shadow-strike-ready {
      color: #8dffb5;
      text-shadow: 0 0 10px #55ff90;
    }
    .shadow-strike-active {
      color: #d1ffe0;
      text-shadow: 0 0 12px #65ff9a;
    }
    .shadow-strike-cooldown {
      color: #9dc9ac;
    }
    .guide-btn:disabled {
      opacity: 0.48;
      border-color: #536080;
      color: #8893b3;
      cursor: not-allowed;
    }
    .guide-btn {
      width: 100%;
      margin-top: 8px;
    }
    .sound-btn {
      width: 100%;
      margin-top: 8px;
      border-color: #b99bff;
      color: #e4d9ff;
    }
    .sound-btn.sound-off {
      border-color: #59607c;
      color: #9aa2bd;
    }
    .modal.guide-modal {
      width: min(390px, 94%);
      max-height: 88%;
      overflow-y: auto;
      text-align: left;
      scrollbar-color: #58e7ff #07102d;
    }
    .guide-modal h2,
    .guide-modal h3 {
      text-align: center;
    }
    .guide-modal h3 {
      margin: 22px 0 8px;
      color: #72f1ff;
      font-size: 16px;
    }
    .guide-modal p,
    .guide-modal li {
      color: #d8e1ff;
      font-size: 13px;
      line-height: 1.6;
    }
    .guide-modal ul {
      margin: 7px 0;
      padding-left: 20px;
    }
    .guide-fighter {
      margin-top: 10px;
      padding: 10px;
      border: 1px solid var(--guide-color, #58e7ff);
      border-radius: 10px;
      background: #07102d99;
    }
    .guide-fighter h4 {
      margin: 0 0 5px;
      color: var(--guide-color, #58e7ff);
    }
    .guide-fighter p {
      margin: 5px 0;
    }
  </style>
  <style>
    .page {
      width: min(1120px, calc(100% - 28px));
    }
    .layout {
      grid-template-columns: 420px 267px 267px;
    }
    .action-side {
      align-content: start;
    }
    @media (max-width: 1050px) {
      .layout {
        grid-template-columns: 420px 267px;
      }
      .action-side {
        grid-column: 2;
      }
    }
    @media (max-width: 780px) {
      .layout {
        grid-template-columns: 1fr;
      }
      .status-side,
      .action-side {
        grid-column: auto;
        grid-template-columns: 1fr;
      }
    }
  </style>
  <body>
    <main class="page">
      <h1>霓虹防线 · 飞机大战</h1>
      <section class="mobile-hud" aria-label="移动端战况">
        <div class="mobile-stats">
          <span>分 <strong id="mobileScore">000000</strong></span>
          <span class="mobile-lives" id="mobileLives">♥♥♥</span>
          <span class="mobile-time" id="mobileTimer">00:00.0</span>
        </div>
        <button class="btn mobile-menu-btn" id="mobileMenu" type="button">菜单</button>
      </section>
      <section class="layout">
        <div class="card arena-panel">
          <div class="arena">
            <canvas id="game" width="480" height="720"></canvas>
            <div class="notice" id="notice"></div>
            <div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
          </div>
          <section class="fighter-skill-progress arena-skill-progress" id="fighterSkillProgress">
            <div class="fighter-progress-row">
              <span id="qProgressName">Q · 充能技</span>
              <div class="fighter-progress-meter">
                <div class="fighter-progress-fill" id="qProgressFill"></div>
              </div>
              <b id="qProgressValue">0 / 100</b>
              <small id="qProgressStatus">充能中</small>
            </div>
            <div class="fighter-progress-row">
              <span id="eProgressName">E · 普通技</span>
              <div class="fighter-progress-meter">
                <div class="fighter-progress-fill" id="eProgressFill"></div>
              </div>
              <b id="eProgressValue">可释放</b>
              <small id="eProgressStatus">可释放</small>
            </div>
          </section>
          <section class="mobile-combat-dock" id="mobileCombatDock" aria-label="技能操作">
            <button class="btn" id="mobileSkillButton" type="button" disabled>Q · 充能技</button>
            <button class="btn mobile-utility" id="mobileUtilityButton" type="button" disabled>
              E · 普通技
            </button>
          </section>
        </div>
        <aside class="side status-side">
          <section class="card">
            <div class="stats">
              <div class="stat">本局得分<strong id="score">000000</strong></div>
              <div class="stat">最高分<strong class="best" id="best">000000</strong></div>
            </div>
            <div class="row">
              生命 <b class="lives" id="lives">♥♥♥</b
              ><b class="state-ready" id="state">等待起飞</b>
            </div>
            <div class="row">战斗用时 <b id="timer">00:00.0</b></div>
            <div class="buff buff-shield">护盾 <b id="shield">未激活</b></div>
            <div class="buff buff-spread">散射弹 <b id="spread">未激活</b></div>
            <div class="buff buff-double">双倍火力 <b id="double">未激活</b></div>
            <div class="skill-card" id="skillCard">
              <div class="row">
                <span id="skillName">战机技能</span><b id="skillStatus">充能中</b>
              </div>
              <button class="btn skill-btn" id="skillButton" disabled>Q · 充能技 · 技能</button>
            </div>
            <div class="blink-card" id="blinkCard" hidden>
              <div class="row">
                <span id="blinkName">瞬闪突袭</span><b id="blinkStatus">可标记</b>
              </div>
              <button class="btn skill-btn" id="blinkButton">E · 普通技 · 瞬闪突袭</button>
            </div>
            <div class="shield-card" id="shieldCard" hidden>
              <div class="row">
                <span id="shieldSkillName">潮涌屏障</span><b id="shieldSkillStatus">可释放</b>
              </div>
              <button class="btn skill-btn" id="shieldButton">E · 普通技 · 潮涌屏障</button>
            </div>
            <div class="shadow-strike-card" id="shadowStrikeCard" hidden>
              <div class="row">
                <span id="shadowStrikeName">影刃双袭</span><b id="shadowStrikeStatus">可突袭</b>
              </div>
              <button class="btn skill-btn" id="shadowStrikeButton">E · 普通技 · 影刃双袭</button>
            </div>
          </section>
          <section class="card">
            <button class="btn" id="rankBtn">查看排行榜</button>
            <ol class="rank" id="rank"></ol>
          </section>
        </aside>
        <aside class="side action-side">
          <section class="card fighter-select">
            <h3>选择战机</h3>
            <p>仅准备阶段可预选，开局后锁定。</p>
            <div class="fighter-options" id="fighterOptions"></div>
          </section>
          <section class="card">
            <div class="btns">
              <button class="btn main" id="pause">暂停</button
              ><button class="btn" id="restart">重新开始</button>
            </div>
            <button class="btn guide-btn" id="guideBtn" title="请先暂停再查看说明">游戏说明</button>
            <button class="btn sound-btn" id="soundBtn">🔊 音效：开</button>
          </section>
          <section class="card">
            移动与射击
            <div class="pad">
              <button data-k="up">↑</button><button data-k="left">←</button
              ><button data-k="down">↓</button><button data-k="right">→</button>
            </div>
          </section>
        </aside>
      </section>
    </main>
    <script src="fighter-catalog.js"></script>
    <script src="game-rules.js"></script>
    <script src="game-storage.js"></script>
    <script src="run-session.js"></script>
    <script src="game-audio.js"></script>
    <script src="page-presentation.js"></script>
    <script>
      const canvas = document.querySelector('#game'),
        keys = {},
        touchKeys = {},
        storage = GameStorage.adapter(localStorage);
      let session = RunSession.create({ rules: GameRules, storage }),
        last = 0,
        touchTarget = null;
      const audio = GameAudio.create({ storage: localStorage });
      const presentation = PagePresentation.create({
        document,
        canvas,
        catalog: FighterCatalog,
        onIntent: dispatch,
      });
      const snapshot = () => ({
        game: session.game,
        view: session.view,
        best: session.best,
        board: session.board,
        soundEnabled: audio.isEnabled(),
      });
      function render() {
        presentation.render(snapshot());
      }
      function clearTouchInput() {
        touchTarget = null;
        for (const direction of ['left', 'right', 'up', 'down']) touchKeys[direction] = false;
      }
      function updateTouchInput() {
        if (!touchTarget || session.game.status !== 'running') return;
        const player = session.game.player,
          dx = touchTarget.x - (player.x + 30),
          dy = touchTarget.y - (player.y + 28),
          deadZone = 12;
        touchKeys.left = dx < -deadZone;
        touchKeys.right = dx > deadZone;
        touchKeys.up = dy < -deadZone;
        touchKeys.down = dy > deadZone;
      }
      function frameInput() {
        return {
          ...keys,
          left: Boolean(keys.left || touchKeys.left),
          right: Boolean(keys.right || touchKeys.right),
          up: Boolean(keys.up || touchKeys.up),
          down: Boolean(keys.down || touchKeys.down),
        };
      }
      function dispatch(intent) {
        audio.unlock();
        if (
          presentation.isControlsLocked() &&
          (intent.type === 'restart' || intent.type === 'toggle-pause')
        ) {
          render();
          return;
        }
        const wasStatus = session.game.status;
        if (intent.type === 'start') {
          clearTouchInput();
          session = RunSession.start(session);
        }
        if (intent.type === 'restart') {
          clearTouchInput();
          session = RunSession.restart(session);
        }
        if (intent.type === 'toggle-pause') {
          session = RunSession.togglePause(session);
          if (session.game.status !== 'running') clearTouchInput();
          if (wasStatus === 'running') audio.play('pause');
          if (wasStatus === 'paused') audio.play('resume');
        }
        if (intent.type === 'mobile-menu' && session.game.status === 'running') {
          session = RunSession.togglePause(session);
          clearTouchInput();
          audio.play('pause');
        }
        if (intent.type === 'toggle-sound') {
          const enabled = audio.toggle();
          if (enabled) {
            audio.unlock();
            audio.play('resume');
          }
        }
        if (intent.type === 'select-fighter')
          session = RunSession.selectFighter(session, intent.fighterId);
        if (intent.type === 'skill' && session.game.status === 'running') keys.skill = true;
        if (intent.type === 'blink' && session.game.status === 'running') keys.blink = true;
        if (intent.type === 'direction') keys[intent.direction] = intent.pressed;
        if (intent.type === 'touch-target' && session.game.status === 'running') {
          touchTarget = {
            x: Math.max(0, Math.min(480, intent.point.x)),
            y: Math.max(288, Math.min(666, intent.point.y)),
          };
          updateTouchInput();
        }
        if (intent.type === 'touch-end') clearTouchInput();
        if (intent.type === 'register') session = RunSession.register(session, intent.id);
        render();
      }
      const keyMap = {
        ArrowLeft: 'left',
        a: 'left',
        A: 'left',
        ArrowRight: 'right',
        d: 'right',
        D: 'right',
        ArrowUp: 'up',
        w: 'up',
        W: 'up',
        ArrowDown: 'down',
        s: 'down',
        S: 'down',
      };
      document.addEventListener('keydown', (event) => {
        audio.unlock();
        if (event.key === 'q' || event.key === 'Q') {
          if (!event.repeat) dispatch({ type: 'skill' });
          event.preventDefault();
          return;
        }
        if (event.key === 'e' || event.key === 'E') {
          if (!event.repeat) dispatch({ type: 'blink' });
          event.preventDefault();
          return;
        }
        if (keyMap[event.key]) {
          keys[keyMap[event.key]] = true;
          event.preventDefault();
        }
        if (event.code === 'Space') {
          event.preventDefault();
          dispatch({ type: 'toggle-pause' });
        }
      });
      document.addEventListener('keyup', (event) => {
        if (keyMap[event.key]) keys[keyMap[event.key]] = false;
      });
      window.addEventListener('blur', clearTouchInput);
      function loop(now) {
        requestAnimationFrame(loop);
        const dt = Math.min(34, now - last || 16);
        last = now;
        if (session.game.status === 'running') {
          updateTouchInput();
          session = RunSession.advance(session, { dt, input: frameInput(), random: Math.random });
          audio.consume(session.events);
          keys.skill = false;
          keys.blink = false;
        }
        render();
      }
      render();
      requestAnimationFrame(loop);
      window.addEventListener('beforeunload', () => audio.destroy());
    </script>
  </body>
</html>
