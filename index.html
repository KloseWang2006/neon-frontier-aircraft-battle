<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>霓虹防线 · 飞机大战</title>
<style>
  :root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#292568,transparent 34%),#05061a;color:#eef;font-family:"PingFang SC","Microsoft YaHei",sans-serif}.page{width:min(850px,calc(100% - 28px));margin:auto;padding:22px}.layout{display:grid;grid-template-columns:420px 267px;gap:18px}.card{background:#10133ddd;border:1px solid #7189df55;border-radius:18px;padding:14px}.arena{position:relative;aspect-ratio:2/3;border:1px solid #58e7ff;border-radius:12px;overflow:hidden}canvas{width:100%;height:100%;display:block}.side{display:grid;gap:13px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat,.buff{padding:10px;border:1px solid #7189df55;border-radius:9px}.stat strong{display:block;font:800 22px Menlo,monospace}.best{color:#ffc75a}.lives{color:#ff71b5;text-shadow:0 0 10px #ff54ae}.state-ready{color:#aeb9ff}.state-running{color:#5ef3ff;text-shadow:0 0 10px #58e7ff}.state-paused{color:#ffc75a;text-shadow:0 0 10px #ffc75a}.buff-shield b{color:#5ef3ff}.buff-spread b{color:#c9a9ff}.buff-double b{color:#ffcf62}.row,.buff{display:flex;justify-content:space-between;margin-top:9px}.skill-card{margin-top:12px;padding:10px;border:1px solid #3f9dce;border-radius:10px;background:#0b284244}.skill-meter{height:8px;margin:8px 0;border-radius:99px;overflow:hidden;background:#051429;border:1px solid #3381ae}.skill-meter-fill{height:100%;width:0;background:linear-gradient(90deg,#2ad5ff,#9e7cff);box-shadow:0 0 12px #58e7ff;transition:width .15s}.shockwave-ready{color:#72f1ff;text-shadow:0 0 10px #58e7ff}.skill-btn{width:100%;margin-top:8px}.skill-btn:disabled{opacity:.5;filter:saturate(.45);cursor:not-allowed}.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn,.pad button{border:1px solid #58e7ff;border-radius:8px;background:#193368;color:#eef;min-height:42px;font:700 15px "PingFang SC","Microsoft YaHei",sans-serif}.btn.main{background:linear-gradient(135deg,#67e8ff,#7788ff);color:#071021}.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.pad button{font-size:22px}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#000a}.overlay[hidden]{display:none}.modal{width:min(320px,90%);padding:20px;border:1px solid #58e7ff;border-radius:14px;background:#101342;text-align:center}.modal input{width:100%;box-sizing:border-box;padding:10px;background:#060821;border:1px solid #7989d8;color:#fff}.register-form{display:grid;gap:10px;margin:18px 0 12px;text-align:left}.register-form label{color:#b9c5ed;font-size:13px;font-weight:700}.register-form .btn{text-align:center}.modal-secondary{width:100%;margin-top:4px;background:#111d4c}.rank{padding:0;list-style:none;font:12px Menlo,monospace}.rank li{display:grid;grid-template-columns:22px 1fr 66px 58px;padding:5px;border-top:1px solid #7892d822}.notice{position:absolute;top:45%;width:100%;text-align:center;color:#58e7ff;font-weight:800;text-shadow:0 0 14px #58e7ff;pointer-events:none}@media(max-width:780px){.layout{grid-template-columns:1fr}.side{grid-template-columns:1fr 1fr}}@media(max-width:465px){.side{grid-template-columns:1fr}}
</style>
<style>
  .fighter-select h3{margin:0 0 9px;font-size:15px}.fighter-select p{margin:3px 0 10px;color:#aeb9df;font-size:12px}.fighter-options{display:grid;gap:8px}.fighter-choice{display:grid;grid-template-columns:44px 1fr;gap:8px;align-items:center;width:100%;padding:7px;border:1px solid #5267a8;border-radius:10px;background:#0a1030;color:#eaf0ff;text-align:left;cursor:pointer}.fighter-choice img{width:42px;height:38px;object-fit:contain;image-rendering:auto}.fighter-choice[data-fighter="silver"] img{transform:rotate(180deg)}.fighter-choice strong{display:block;font-size:14px}.fighter-choice small{display:block;margin-top:2px;color:#aeb9df;font-size:11px}.fighter-choice.selected{border-color:#65e8ff;box-shadow:0 0 12px #38d8ff55;background:#15365b}.fighter-choice[data-fighter="silver"].selected{border-color:#d8e4f0;box-shadow:0 0 12px #d9e9ff55;background:#30384b}.fighter-choice[data-fighter="green"].selected{border-color:#75ff9e;box-shadow:0 0 12px #58ff8d55;background:#133d2d}.fighter-choice:disabled{cursor:not-allowed;opacity:.62}.stealth-active{color:#dcecff;text-shadow:0 0 10px #b7dcff}.wingmen-active{color:#7dffab;text-shadow:0 0 10px #55ff90}
</style>
<style>
  .page{width:min(1120px,calc(100% - 28px))}.layout{grid-template-columns:420px 267px 267px}.action-side{align-content:start}@media(max-width:1050px){.layout{grid-template-columns:420px 267px}.action-side{grid-column:2}}@media(max-width:780px){.layout{grid-template-columns:1fr}.status-side,.action-side{grid-column:auto;grid-template-columns:1fr}}
</style>
<body>
<main class="page">
  <h1>霓虹防线 · 飞机大战</h1>
  <section class="layout">
    <div class="card"><div class="arena">
      <canvas id="game" width="480" height="720"></canvas>
      <div class="notice" id="notice"></div>
      <div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
    </div></div>
    <aside class="side status-side">
      <section class="card">
        <div class="stats"><div class="stat">本局得分<strong id="score">000000</strong></div><div class="stat">最高分<strong class="best" id="best">000000</strong></div></div>
        <div class="row">生命 <b class="lives" id="lives">♥♥♥</b><b class="state-ready" id="state">等待起飞</b></div>
        <div class="row">战斗用时 <b id="timer">00:00.0</b></div>
        <div class="buff buff-shield">护盾 <b id="shield">未激活</b></div>
        <div class="buff buff-spread">散射弹 <b id="spread">未激活</b></div>
        <div class="buff buff-double">双倍火力 <b id="double">未激活</b></div>
        <div class="skill-card"><div class="row"><span id="skillName">冲击波</span><b id="skillCharge">0 / 100</b></div><div class="skill-meter"><div class="skill-meter-fill" id="skillMeter"></div></div><div class="row"><span>技能状态</span><b id="skillStatus">充能中</b></div><button class="btn skill-btn" id="skillButton" disabled>Q · 冲击波</button></div>
      </section>
      <section class="card"><button class="btn" id="rankBtn">查看排行榜</button><ol class="rank" id="rank"></ol></section>
    </aside>
    <aside class="side action-side">
      <section class="card fighter-select"><h3>选择战机</h3><p>仅准备阶段可预选，开局后锁定。</p><div class="fighter-options"><button class="fighter-choice selected" data-fighter="azure" type="button"><img src="assets/player-ship.png" alt="蔚蓝风暴预览"><span><strong>蔚蓝风暴</strong><small>冲击波 · 范围清场</small></span></button><button class="fighter-choice" data-fighter="silver" type="button"><img src="assets/player-silver-stealth.png" alt="银翼杀手预览"><span><strong>银翼杀手</strong><small>隐匿 · 3 秒无敌</small></span></button><button class="fighter-choice" data-fighter="green" type="button"><img src="assets/player-green-ninja.png" alt="青岚影忍预览"><span><strong>青岚影忍</strong><small>影分身援护 · 双僚机支援</small></span></button></div></section>
      <section class="card"><div class="btns"><button class="btn main" id="pause">暂停</button><button class="btn" id="restart">重新开始</button></div></section>
      <section class="card">移动与射击<div class="pad"><button data-k="up">↑</button><button data-k="left">←</button><button data-k="down">↓</button><button data-k="right">→</button></div></section>
    </aside>
  </section>
</main>
<script src="game-rules.js"></script>
<script src="game-storage.js"></script>
<script src="run-session.js"></script>
<script>
  const $=q=>document.querySelector(q),C=$('#game'),X=C.getContext('2d'),keys={};
  const ims={};
  for(const[k,f]of Object.entries({player:'player-ship.png',silver:'player-silver-stealth.png',green:'player-green-ninja.png',normal:'enemy-normal.png',fast:'enemy-fast.png',elite:'enemy-elite.png',boss:'boss-ship.png',shield:'power-shield.png',spread:'power-spread.png',double:'power-double-fire.png',heal:'power-heal.png',star:'starfield.png'})){const i=new Image();i.src='assets/'+f;ims[k]=i}
  let session=RunSession.create({rules:GameRules,storage:GameStorage.adapter(localStorage)}),last=0;
  const pad=n=>String(n).padStart(6,'0'),tm=n=>{let s=Math.floor(n/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')+'.'+Math.floor(n/100)%10};
  function ranks(){$('#rank').innerHTML=session.board.map((r,i)=>`<li>${i+1}<span>${r.id}</span><b>${pad(r.score)}</b><span>${tm(r.time)}</span></li>`).join('')||'<li>尚无记录</li>'}
  function ui(){const s=session.game,v=session.view,f=GameRules.fighters[s.fighterId],stateName=s.status==='running'?'running':s.status==='paused'?'paused':'ready',skillReady=s.skillCharge>=GameRules.constants.SKILL_MAX&&s.skillCooldownMs===0,selectable=s.status==='ready';$('#score').textContent=pad(s.score);$('#best').textContent=pad(session.best);$('#lives').textContent='♥'.repeat(s.player.lives)+'♡'.repeat(3-s.player.lives);$('#timer').textContent=tm(s.elapsedMs);$('#state').textContent=stateName==='running'?'火力全开':stateName==='paused'?'已暂停':'等待起飞';$('#state').className='state-'+stateName;for(const[k,id]of[['shieldMs','shield'],['spreadMs','spread'],['doubleMs','double']]){const item=$( '#'+id);item.textContent=s[k]?(s[k]/1000).toFixed(1)+'s':'未激活';item.parentElement.className='buff buff-'+id}$('#skillName').textContent=f.skillName;$('#skillCharge').textContent=s.skillCharge+' / '+GameRules.constants.SKILL_MAX;$('#skillMeter').style.width=(s.skillCharge/GameRules.constants.SKILL_MAX*100)+'%';$('#skillStatus').textContent=s.wingmenMs>0?'援护中 '+(s.wingmenMs/1000).toFixed(1)+'s':s.stealthMs>0?'隐匿中 '+(s.stealthMs/1000).toFixed(1)+'s':skillReady?'可释放':s.skillCooldownMs>0?'冷却 '+(s.skillCooldownMs/1000).toFixed(1)+'s':'充能中';$('#skillStatus').className=s.wingmenMs>0?'wingmen-active':s.stealthMs>0?'stealth-active':skillReady?'shockwave-ready':'';$('#skillButton').textContent='Q · '+f.skillName;$('#skillButton').disabled=!skillReady;document.querySelectorAll('[data-fighter]').forEach(b=>{const chosen=b.dataset.fighter===s.fighterId;b.classList.toggle('selected',chosen);b.setAttribute('aria-pressed',String(chosen));b.disabled=!selectable});$('#notice').textContent=v.notice||'';ranks()}
  function sp(i,x,y,w,h,c){if(i&&i.complete&&i.naturalWidth){X.save();X.globalCompositeOperation='screen';X.drawImage(i,x,y,w,h);X.restore()}else{X.fillStyle=c;X.fillRect(x,y,w,h)}}
  function drawShockwave(s){if(s.shockwaveFlashMs<=0)return;const t=1-s.shockwaveFlashMs/520,cx=s.player.x+30,cy=s.player.y+28,r=300*t;X.save();X.globalCompositeOperation='screen';X.globalAlpha=.75*(1-t)+.15;X.strokeStyle='#57eaff';X.shadowColor='#57eaff';X.shadowBlur=22;X.lineWidth=5-2*t;X.beginPath();X.arc(cx,cy,r,0,Math.PI*2);X.stroke();X.globalAlpha=.22*(1-t);X.fillStyle='#68b6ff';X.beginPath();X.arc(cx,cy,r,0,Math.PI*2);X.fill();X.restore()}
  function drawStealth(s){if(s.stealthMs<=0)return;const t=s.stealthMs/GameRules.constants.STEALTH_DURATION,cx=s.player.x+30,cy=s.player.y+27;X.save();X.globalCompositeOperation='screen';X.globalAlpha=.18+.25*t;X.strokeStyle='#d9eeff';X.shadowColor='#9edfff';X.shadowBlur=18;X.lineWidth=2;X.beginPath();X.arc(cx,cy,38+(1-t)*12,0,Math.PI*2);X.stroke();for(let i=0;i<8;i++){const a=i*Math.PI/4+t*5;X.fillStyle='#d5f3ff';X.fillRect(cx+Math.cos(a)*42,cy+Math.sin(a)*34,2,2)}X.restore()}
  function drawWingmen(s,f){if(f.id!=='green'||s.wingmenMs<=0)return;const positions=[{x:s.player.x-16,y:s.player.y+22},{x:s.player.x+46,y:s.player.y+22}],t=s.wingmenMs/GameRules.constants.WINGMEN_DURATION;X.save();X.globalCompositeOperation='screen';X.strokeStyle='#65ff9a';X.shadowColor='#54ff91';X.shadowBlur=15;X.globalAlpha=.35+.35*t;for(const p of positions){X.beginPath();X.moveTo(p.x+15,p.y+25);X.lineTo(p.x+15,p.y+44);X.stroke();sp(ims.green,p.x,p.y,30,27,'#65ff9a')}X.restore()}
  function drawPlayer(s,f){const i=ims[f.sprite];if(f.id==='silver'&&i&&i.complete&&i.naturalWidth){X.save();X.globalCompositeOperation='screen';X.translate(s.player.x+30,s.player.y+27);X.rotate(Math.PI);X.drawImage(i,-30,-27,60,54);X.restore();return}sp(i,s.player.x,s.player.y,60,54,f.bulletColor)}
  function draw(){const s=session.game,f=GameRules.fighters[s.fighterId];X.fillStyle='#05061a';X.fillRect(0,0,480,720);if(ims.star.complete){X.globalAlpha=.5;X.drawImage(ims.star,0,0,480,720);X.globalAlpha=1}for(const b of s.bullets)sp(null,b.x,b.y,b.w,b.h,b.color||'#5ef');for(const b of s.enemyBullets)sp(null,b.x,b.y,b.w,b.h,'#f5c');for(const e of s.enemies)sp(ims[e.kind],e.x,e.y,e.w,e.h,'#d5f');for(const p of s.powerups)sp(ims[p.kind],p.x,p.y,p.w,p.h,p.kind==='heal'?'#71ff96':'#fd6');if(s.boss){sp(ims.boss,s.boss.x,s.boss.y,s.boss.w,s.boss.h,'#f5c');X.fillStyle='#261338';X.fillRect(118,18,244,8);X.fillStyle='#f35bd8';X.fillRect(120,20,240*s.boss.hp/s.boss.maxHp,4)}if(s.shieldAvailable){X.strokeStyle='#58e7ff';X.lineWidth=2;X.shadowColor='#58e7ff';X.shadowBlur=12;X.beginPath();X.arc(s.player.x+30,s.player.y+28,40,0,Math.PI*2);X.stroke();X.shadowBlur=0}if(s.healFlashMs>0){const t=s.healFlashMs/700;X.save();X.globalAlpha=.25+.55*t;X.strokeStyle='#71ff96';X.lineWidth=3;X.shadowColor='#71ff96';X.shadowBlur=18;X.beginPath();X.arc(s.player.x+30,s.player.y+28,42+(1-t)*18,0,Math.PI*2);X.stroke();X.font='bold 16px PingFang SC, sans-serif';X.textAlign='center';X.fillStyle='#b8ffc8';X.fillText('生命 +1',s.player.x+30,s.player.y-14-(1-t)*12);X.restore()}drawStealth(s);drawWingmen(s,f);if(s.stealthMs>0||!s.player.invincibleMs||Math.floor(s.player.invincibleMs/80)%2===0){X.save();if(s.stealthMs>0)X.globalAlpha=.34;drawPlayer(s,f);X.restore()}}
  function modal(mode){const m=$('#modal'),o=$('#overlay');o.hidden=false;if(mode==='ready'){m.innerHTML='<h2>准备起飞？</h2><button class="btn main" id="go">启动战机</button>';$('#go').onclick=()=>{session=RunSession.start(session);o.hidden=true;ui()};return}if(mode==='rank'){m.innerHTML='<h2>排行榜</h2>'+$('#rank').outerHTML+'<button class="btn" id="close">关闭</button>';$('#close').onclick=()=>o.hidden=true;return}const v=session.view;m.innerHTML=`<h2>${v.endReason==='victory'?'通关成功':'任务结束'}</h2><p>得分 ${pad(session.game.score)} · 用时 ${tm(session.game.elapsedMs)}</p>${v.canRegister?'<div class="register-form"><label for="pid">Player ID</label><input id="pid" placeholder="输入你的代号"><button class="btn main" id="save">登记成绩</button></div>':''}<button class="btn modal-secondary" id="again">重新开始</button>`;$('#again').onclick=()=>{session=RunSession.restart(session);o.hidden=true;ui()};const save=$('#save');if(save)save.onclick=()=>{session=RunSession.register(session,$('#pid').value);o.hidden=true;ui()}}
  function loop(n){requestAnimationFrame(loop);const dt=Math.min(34,n-last||16);last=n;if(session.game.status==='running'){session=RunSession.advance(session,{dt,input:keys,random:Math.random});keys.skill=false;if(session.view.overlay==='ended')modal('ended');ui()}draw();drawShockwave(session.game)}
  const keyMap={ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right',ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down'};
  function releaseSkill(){if(session.game.status==='running')keys.skill=true}
  document.addEventListener('keydown',e=>{if(e.key==='q'||e.key==='Q'){if(!e.repeat)releaseSkill();e.preventDefault();return}if(keyMap[e.key]){keys[keyMap[e.key]]=true;e.preventDefault()}if(e.code==='Space'){e.preventDefault();session=RunSession.togglePause(session);ui()}});
  document.addEventListener('keyup',e=>{if(keyMap[e.key])keys[keyMap[e.key]]=false});
  document.querySelectorAll('[data-k]').forEach(b=>{const off=()=>keys[b.dataset.k]=false;b.onpointerdown=e=>{e.preventDefault();keys[b.dataset.k]=true};b.onpointerup=b.onpointerleave=b.onpointercancel=off});
  document.querySelectorAll('[data-fighter]').forEach(b=>b.onclick=()=>{session=RunSession.selectFighter(session,b.dataset.fighter);ui()});
  $('#pause').onclick=()=>{session=RunSession.togglePause(session);ui()};$('#restart').onclick=()=>{session=RunSession.restart(session);ui()};$('#skillButton').onclick=releaseSkill;$('#rankBtn').onclick=()=>modal('rank');
  ui();modal('ready');requestAnimationFrame(loop);
</script>
</body>
</html>
